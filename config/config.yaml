# Remember or Retrieve — pipeline configuration
# Later steps append their own sections (training, registry, serving, ...).

corpus:
  source: osrs_wiki
  license: CC BY-NC-SA 3.0
  user_agent: "remember-or-retrieve/0.1 (portfolio project; contact: daniel.lofeodo@gmail.com)"

data:
  corpus_path: data/corpus/chunks.jsonl
  golden_set_path: data/eval/golden_set.json
  provenance_path: data/PROVENANCE.json

compute:
  # Decided in step 2 (see docs/compute-plan.md). Prices are us-central1 spot, USD/hr,
  # verified against the GCP Billing Catalog on 2026-10-09.
  base_model: Qwen/Qwen3-8B # 8.2B, Apache-2.0
  train_machine: a2-highgpu-4g # 4x A100 40GB
  train_gpu_count: 4
  strategy:
    full_finetune: fsdp_full_shard
    lora: ddp
  spot_usd_per_hour: 8.82
  on_demand_usd_per_hour: 14.69
  regions: [us-central1, us-east1, europe-west4]
  fallback_machine: a2-ultragpu-4g # 4x A100 80GB, spot 12.17/hr
  jax_model: null # chosen and verified in step 7 (Gemma 2B to 4B class; gated on Hugging Face)

budget:
  target_usd: 20
  cap_usd: 50
  expected_usd: 34

training_data:
  # Step 3. Claude is used at build time only (never at inference).
  # Model ids and prices verified against the claude-api reference on 2026-10-13.
  generator_model: claude-sonnet-5-5 # multi-hop generation only (reasoning and arithmetic)
  cheap_model: claude-haiku-5-5 # single-hop, abstention, verification, DPO-rejected (decided 2026-10-13 after the $13 Sonnet-everywhere estimate)
  prices_usd_per_mtok: # standard (non-batch) rates; the batch discount is applied below
    claude-sonnet-5-5: { input: 2.0, output: 10.0 }
    claude-haiku-5-5: { input: 0.10, output: 0.50 }
  batch_discount: 0.5
  max_usd: 5 # abort before submit if the estimate exceeds this
  seed: 1729
  raw_dir: data/raw/training # untracked: batch ids, requests, raw responses
  out_dir: data/training # frozen, committed
  # Requests per kind. Over-generate, then trim to the targets after validation drops.
  sft_targets: { single_hop: 4000, multi_hop: 1000, unanswerable: 900, val_fraction: 0.05 }
  grpo_targets: { single_hop: 450, multi_hop: 120, unanswerable: 150 }
  pairs_per_chunk: { table: 7, infobox: 6, prose: 5 } # single-hop pairs asked per chunk (SFT)
  multi_hop_requests: { sft: 950, grpo: 150 }
  unanswerable: { sft_questions_per_cluster: 3, cluster_size: 3, grpo_clusters: 60 }
  grpo_single_hop: { chunks: 220, pairs_per_chunk: 2 }
  dpo_targets: { hallucinated: 700, verbose: 500, fabricated_abstention: 300 }
  leakage:
    embedding_model: BAAI/bge-large-en-v1.5
    cosine: 0.85 # calibrated by hand on 2026-10-13: 0.88 let real paraphrases through (0.877, 0.878)
    jaccard: 0.5 # normalized word 5-gram Jaccard against any golden question
    dedup_cosine: 0.95 # near-duplicates within the training set
    dedup_jaccard: 0.7

scoring:
  # Step 4. One scorer for every system (fine-tune, RAG, Mistral, Cohere) and the GRPO reward.
  judge:
    model: claude-sonnet-5 # same judge and prompt as rag-with-receipts, so its numbers reproduce
    max_tokens: 1024
    prices_usd_per_mtok: { input: 2.0, output: 10.0 } # sync calls, no batch discount
    max_usd: 1 # abort before any paid call if the estimate exceeds this
    workers: 4
  cache_dir: data/raw/scoring # untracked
  reference_path: data/eval/rag_reference.json
  grounding:
    nli_model: cross-encoder/nli-deberta-v3-base
    nli_revision: null # pinned when the model is first downloaded (see roadmap step 4)
    batch_size: 32
    entailment_threshold: 0.5
    contradiction_threshold: 0.5
    overlap_threshold: 0.3
  validation:
    judge_accuracy_tolerance: 0.055 # re-judged accuracy vs published 0.836 (3 questions)
    judge_min_agreement: 0.90
    nli_prob_tolerance: 0.001
  reward:
    # Fast local GRPO reward (no network, no GPU). Range is [-1, 1].
    # Length budget in words: max(min_words, per_ref_word * words in the reference answer).
    # SFT answers run p50 10 / p99 28 words (single-hop) and p99 42 (multi-hop).
    abstain_on_answerable: 0.5 # penalty for declining a question the corpus answers
    answered_unanswerable: 0.5 # penalty for answering a question that should be declined
    unsupported_number: 0.25 # per number in neither the reference, the question, nor the chunks
    unsupported_number_cap: 0.5
    stray_number: 0.05 # per number found in the chunks but not in the reference (spray guard)
    stray_number_cap: 0.2
    verbosity: 0.3 # maximum penalty, reached at twice the length budget
    min_words: 30
    per_ref_word: 2.0
