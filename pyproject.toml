[project]
name = "remember-or-retrieve"
version = "0.1.0"
description = "Fine-tuned model vs RAG on the OSRS Wiki: does the model remember the answer or retrieve it?"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "numpy",
    "pytest",
    "ruff",
]
data = [
    "anthropic==1.13.0",
    "numpy",
    "sentence-transformers",
]
eval = [
    "anthropic==1.13.0",
    "numpy",
    "sentence-transformers",
]
train = [
    "accelerate==1.15.0",
    "numpy",
    "peft==0.21.2",
    "pynvml==13.0.1",
    "ray[train]==2.59.0",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==5.19.0",
    "trl==1.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load a real model or make a real external API call; excluded by default",
]
addopts = '-m "not slow"'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
