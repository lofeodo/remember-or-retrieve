name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/verify_data.py

  # Real multi-process runs of every training stage on a tiny model (CPU, gloo, Ray Train).
  # Proves DDP/FSDP2, the distribution checks, resume, and DPO before any GPU is rented.
  smoke-distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -m slow tests/test_training_smoke.py tests/test_training_tokenization.py -q
        env:
          PYTHONFAULTHANDLER: "1" # a native abort in a worker prints a Python traceback

  # Step 7. The JAX LoRA stage on a tiny Gemma 4 over two virtual CPU devices. Own job because
  # gemma 4.x needs Python 3.12 while the PyTorch stack stays on 3.11.
  smoke-jax:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,jax]"
      - run: pytest -m slow tests/test_jax_smoke.py -q
        env:
          XLA_FLAGS: --xla_force_host_platform_device_count=2
